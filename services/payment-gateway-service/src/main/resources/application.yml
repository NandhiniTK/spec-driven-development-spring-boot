server:
  port: 8081

spring:
  application:
    name: payment-gateway-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/paymentgatewaydb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:your-access-key}
        secret-key: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
      sqs:
        enabled: false  # Set to true when AWS credentials are configured

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: payment-gateway-service
    export:
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:your-access-key}
        secret-key: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
      sqs:
        enabled: true

# Payment Processing Queue
payment:
  queue:
    name: payment-processing-queue
    dlq-name: payment-processing-dlq
    visibility-timeout: 30
    max-receive-count: 3
  gateway:
    webhook-secret: mock-webhook-secret-key

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  
  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  
  timelimiter:
    instances:
      paymentGateway:
        timeout-duration: 10s
  
  bulkhead:
    instances:
      paymentGateway:
        max-concurrent-calls: 50
        max-wait-duration: 0
